AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  GridGuard backend: HTTP API + Lambdas + DynamoDB + S3.
  Simulated only. The AI never controls real equipment and never sends alerts.

# Deploy from backend/:  sam build && sam deploy   (settings in samconfig.toml)

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:5173"
    Description: Browser origins allowed by CORS. Add the Amplify URL once P4 has it.
  AgentWorker:
    Type: String
    Default: stub
    AllowedValues: [stub, bedrock]
    Description: >
      Which worker POST /runs starts. "stub" = rule-based placeholder (no Bedrock).
      "bedrock" = P2's real agent in functions/agent_worker/app.py.
      Switch with: sam deploy --parameter-overrides AgentWorker=bedrock
  BedrockModelId:
    Type: String
    Default: "us.anthropic.claude-sonnet-4-5-20250929-v1:0"
    Description: Bedrock inference profile ID used by the real agent (see tech.md).
  GuardrailId:
    Type: String
    Default: ""
    Description: Bedrock Guardrail ID (P2-10). Empty = no guardrail yet.
  GuardrailVersion:
    Type: String
    Default: DRAFT
  DailyRunCap:
    Type: Number
    Default: 100
    MinValue: 1

Conditions:
  UseBedrockAgent: !Equals [!Ref AgentWorker, bedrock]

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 10
    # Every function ships the whole backend/ folder (small), so `from shared.x import y`
    # works the same way it does in the tests.
    CodeUri: .
    Environment:
      Variables:
        FORECAST_BUCKET: !Ref DataBucket
        FORECAST_PREFIX: forecasts/
        SCENARIO_PREFIX: scenarios/
        RUNS_TABLE: !Ref RunsTable
        DECISIONS_TABLE: !Ref DecisionsTable
        COUNTERS_TABLE: !Ref CountersTable
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        BEDROCK_GUARDRAIL_ID: !Ref GuardrailId
        BEDROCK_GUARDRAIL_VERSION: !Ref GuardrailVersion
        AGENT_WORKER: !Ref AgentWorker
        DAILY_RUN_CAP: !Ref DailyRunCap
        AGENT_MAX_SIMULATE_CALLS: "5"
        AGENT_MAX_TOOL_CALLS: "12"
        LOG_LEVEL: INFO
    Tags:
      project: gridguard

Resources:
  # ---------------------------------------------------------------------------
  # Storage
  # ---------------------------------------------------------------------------

  DataBucket:
    Type: AWS::S3::Bucket
    Properties:
      # scenarios/{id}.json (C2) and forecasts/{id}.json (C1). Private, encrypted.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - Key: project
          Value: gridguard

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub "${DataBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  RunsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
      Tags:
        - Key: project
          Value: gridguard

  DecisionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: run_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: run_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      Tags:
        - Key: project
          Value: gridguard

  CountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # One item per Pacific-time day: {day, runs}. Daily run cap (C5).
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: day
          AttributeType: S
      KeySchema:
        - AttributeName: day
          KeyType: HASH
      Tags:
        - Key: project
          Value: gridguard

  # ---------------------------------------------------------------------------
  # HTTP API (no login: cost protection is throttling + the daily run cap)
  # ---------------------------------------------------------------------------

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingRateLimit: 20
        ThrottlingBurstLimit: 40
      RouteSettings:
        # Starting a run is the only route that can lead to Bedrock spend: keep it slow.
        "POST /runs":
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 2
      Tags:
        project: gridguard

  # ---------------------------------------------------------------------------
  # Functions (plain code only; the agent worker is added with spec 03)
  # ---------------------------------------------------------------------------

  ScenariosFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /scenarios
      Handler: functions.scenarios_api.app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /scenarios

  ResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /resources
      Handler: functions.resources_api.app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /resources

  ForecastFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /forecast
      Handler: functions.forecast_api.app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /forecast

  SimulateFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /simulate (what-if, plain code)
      Handler: functions.simulate_api.app.handler
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /simulate

  # ---------------------------------------------------------------------------
  # Agent runs: start (async) -> worker -> poll status
  # ---------------------------------------------------------------------------

  AgentStartFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /runs (daily cap, save run, start worker async)
      Handler: functions.agent_start.app.handler
      Environment:
        Variables:
          WORKER_FUNCTION_NAME: !If [UseBedrockAgent, !Ref AgentWorkerFunction, !Ref AgentWorkerStubFunction]
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBWritePolicy:
            TableName: !Ref RunsTable
        - DynamoDBWritePolicy:
            TableName: !Ref CountersTable
        - LambdaInvokePolicy:
            FunctionName: !If [UseBedrockAgent, !Ref AgentWorkerFunction, !Ref AgentWorkerStubFunction]
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /runs

  RunStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: GET /runs/{run_id}
      Handler: functions.run_status.app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RunsTable
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /runs/{run_id}

  AgentWorkerStubFunction:
    Type: AWS::Serverless::Function
    Properties:
      # TEMPORARY: simple rules, no Bedrock. P2's agent_worker replaces it
      # (point AgentStartFunction's WORKER_FUNCTION_NAME at the new function).
      Description: STUB agent worker (no Bedrock)
      Handler: functions.agent_worker_stub.app.handler
      Timeout: 60
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable

  AgentWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: UseBedrockAgent  # only created with AgentWorker=bedrock
    Properties:
      # P2's real agent: Bedrock Converse API + tools, max 5 simulate / 12 tool calls.
      Description: Bedrock agent worker (P2)
      Handler: functions.agent_worker.app.handler
      Timeout: 300  # 5 minutes; GET /runs reports runs older than 6 minutes as RUN_TIMED_OUT
      MemorySize: 512
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref DataBucket
        - DynamoDBCrudPolicy:
            TableName: !Ref RunsTable
        - Statement:
            - Sid: CallClaudeThroughUsInferenceProfiles
              Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource:
                - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*"
                - "arn:aws:bedrock:*::foundation-model/anthropic.*"
            - Sid: UseOurGuardrails
              Effect: Allow
              Action: bedrock:ApplyGuardrail
              Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail/*"

  # ---------------------------------------------------------------------------
  # Decisions and audit log
  # ---------------------------------------------------------------------------

  # GET /forecast (ForecastFunction) comes from Snehil's feature/snehil-forecast-api branch.

  DecisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: POST /runs/{run_id}/decision and GET /audit
      Handler: functions.decision_api.app.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RunsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DecisionsTable
        - DynamoDBWritePolicy:
            TableName: !Ref DecisionsTable
      Events:
        Decision:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /runs/{run_id}/decision
        Audit:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /audit

Outputs:
  ApiUrl:
    Description: Base URL for the dashboard (VITE_API_URL)
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  DataBucketName:
    Description: Bucket for scenarios/ and forecasts/ (FORECAST_BUCKET)
    Value: !Ref DataBucket
  RunsTableName:
    Value: !Ref RunsTable
  DecisionsTableName:
    Value: !Ref DecisionsTable
  CountersTableName:
    Value: !Ref CountersTable
